[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
shoebox-core = { path = "crates/shoebox-core" }
shoebox-decode = { path = "crates/shoebox-decode" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.37.0"

[profile.release]
lto = "thin"

# Decoders and encoders are painfully slow unoptimised; tests decode real images.
[profile.dev.package."*"]
opt-level = 2
