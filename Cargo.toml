[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/PinkOctopusLabs/shoebox"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
shoebox-core = { path = "crates/shoebox-core" }
shoebox-decode = { path = "crates/shoebox-decode" }
shoebox-develop = { path = "crates/shoebox-develop" }
shoebox-ml = { path = "crates/shoebox-ml" }
shoebox-photos = { path = "crates/shoebox-photos" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
# Monochrome emoji fonts cover the symbols the UI draws (★ ✔ ✖ ⚠ …);
# tests/glyphs.rs fails if a label uses a glyph no bundled font has.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }

# candle's Metal kernels with one fix (see vendor/README.md).
[patch.crates-io]
candle-metal-kernels = { path = "vendor/candle-metal-kernels" }

[profile.release]
lto = "thin"

# Decoders and encoders are painfully slow unoptimised; tests decode real images.
[profile.dev.package."*"]
opt-level = 2
