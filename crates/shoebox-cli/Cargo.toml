[package]
name = "shoebox-cli"
description = "Headless Shoebox commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "shoebox"
path = "src/main.rs"

[dependencies]
shoebox-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
blake3 = "1.8.7"
shoebox-decode = { version = "0.1.0", path = "../shoebox-decode" }

[dev-dependencies]
csv = "1.4.0"
shoebox-fixtures = { path = "../shoebox-fixtures" }
tempfile = "3.27.0"
