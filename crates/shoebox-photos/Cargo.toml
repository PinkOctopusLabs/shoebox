[package]
name = "shoebox-photos"
description = "iCloud Photos through PhotoKit: the PhotoSource Shoebox syncs from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
jiff = "0.2.38"
shoebox-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-photos = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-location", "PHAdjustmentData", "PHAsset", "PHAssetChangeRequest", "PHAssetCollectionChangeRequest", "PHAssetCreationRequest", "PHAssetResource", "PHAssetResourceManager", "PHChangeRequest", "PHCloudIdentifier", "PHCollection", "PHContentEditingInput", "PHContentEditingOutput", "PHFetchOptions", "PHFetchResult", "PHObject", "PHPhotoLibrary", "PhotosTypes"] }

[dev-dependencies]
anyhow.workspace = true
