[package]
name = "shoebox-decode"
description = "Image decoding, NEF preview extraction and grayscale thumbnails."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
moxcms = "0.9.1"
png = "0.18.1"
thiserror.workspace = true
tracing.workspace = true
tiff = "0.11.3"
turbojpeg = { version = "1.5.1", optional = true, default-features = false }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[features]
# Benchmark-only: links Homebrew's libjpeg-turbo. See benches/jpeg_thumb.rs.
bench-turbojpeg = ["dep:turbojpeg"]

[dev-dependencies]
criterion = "0.8.2"
moxcms = "0.9.1"
rayon = "1.12.0"
shoebox-fixtures = { path = "../shoebox-fixtures" }
tempfile = "3.27.0"

[[bench]]
name = "jpeg_thumb"
harness = false
