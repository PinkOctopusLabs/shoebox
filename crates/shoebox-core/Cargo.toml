[package]
name = "shoebox-core"
description = "Library model, scanning, hashing, duplicate index, journaled file operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["rayon"] }
csv = "1.4.0"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
libc = "0.2.190"
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shoebox-decode.workspace = true
thiserror.workspace = true
tracing.workspace = true
walkdir = "2.5.0"
trash = { version = "5.2.9", default-features = false }

[dev-dependencies]
anyhow.workspace = true
criterion = "0.8.2"
proptest = "1.12.0"
shoebox-fixtures = { path = "../shoebox-fixtures" }
tempfile = "3.27.0"

[[bench]]
name = "index"
harness = false
