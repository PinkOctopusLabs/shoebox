[package]
name = "shoebox-ml"
description = "Image and text embeddings for semantic search (SigLIP 2 on candle)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shoebox-decode.workspace = true
thiserror.workspace = true
tracing.workspace = true
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
half = "2.7.1"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
ureq = "3.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.0", features = ["metal", "accelerate"] }

[dev-dependencies]
anyhow.workspace = true
tempfile = "3.27.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
