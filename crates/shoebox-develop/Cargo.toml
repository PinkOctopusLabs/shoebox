[package]
name = "shoebox-develop"
description = "Photo editing: raw preparation, edit documents and the render pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["rayon"] }
half = "2.7.1"
jiff = "0.2.38"
jpeg-encoder = "0.7.1"
lensfun = "0.7.0"
png = "0.18.1"
json-patch = "4.2.0"
moxcms = "0.9.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shoebox-decode.workspace = true
skrifa = "0.44.0"
tempfile = "3.27.0"
thiserror.workspace = true
tiff = "0.11.3"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
tracing.workspace = true
wgpu = "30.0.1"

[dev-dependencies]
criterion = "0.8.2"
epaint_default_fonts = "0.37.0"
png = "0.18.1"
serde_json = "1.0.154"
shoebox-fixtures = { path = "../shoebox-fixtures" }
shoebox-ml.workspace = true
tempfile = "3.27.0"
tiff = "0.11.3"
wgpu = "30.0.1"

[[bench]]
name = "pipeline"
harness = false
